# nginx: принимает https и отдаёт запросы сайту на 127.0.0.1:4321.
# Установка: sudo cp deploy/nginx-stay.conf /etc/nginx/sites-available/stay && sudo ln -s ../sites-available/stay /etc/nginx/sites-enabled/
# SSL выпускает certbot: sudo certbot --nginx -d stay.com.tr -d www.stay.com.tr
server {
    listen 80;
    listen [::]:80;
    server_name stay.com.tr www.stay.com.tr;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Файлы сборки с хэшем в имени — кэшировать надолго.
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Шрифты и свои картинки (имена без хэша) — неделя; сайт на Node отдаёт их с max-age=0.
    location ~ ^/(fonts|hero|media)/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
