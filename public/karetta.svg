<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -12 120 140" width="480" height="560">
<title>Каретта — талисман Stay Property</title>
<style>
.body{animation:bob 3.2s ease-in-out infinite}
.mascot-flipper{transform-origin:88px 76px;animation:wave 2.4s ease-in-out infinite}
.mascot-eyes{transform-origin:60px 45px;animation:blink 5s infinite}
.shadow{transform-origin:60px 122px;animation:shadow 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-22deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-16deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.18}50%{transform:scaleX(.75);opacity:.1}}
</style>
<ellipse class="shadow" cx="60" cy="122" rx="30" ry="4" fill="#2a1d6b" opacity=".18"/>
